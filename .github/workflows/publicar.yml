# Publica o site estático de Sergio Gonçalves — Consultoria Contábil no GitHub Pages.
# O pacote site.tar.gz contém somente a saída de produção (dist/) gerada pelo projeto-fonte.
name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - site.tar.gz
      - site.tar.gz.sha256
      - .github/workflows/publicar.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir integridade e extrair o pacote
        run: |
          sha256sum -c site.tar.gz.sha256
          mkdir _site
          tar -xzf site.tar.gz -C _site
          test -f _site/index.html
          test -f _site/404.html
          echo "Arquivos publicados: $(find _site -type f | wc -l)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
